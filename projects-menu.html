<!DOCTYPE html>
<html lang="en" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="UTF-8">
    <title>Ciarán Brennan | Projects</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Ciarán Brennan">
    <meta name="description" content="A collection of projects covering analytics, web development, design and sport.">
    <link rel="canonical" href="https://cbrennan.ie/projects-menu">

    <!-- OpenGraph -->
    <meta property="og:title" content="Ciarán Brennan - Projects">
    <meta property="og:description" content="Projects across analytics, web development, design and sport.">
    <meta property="og:image" content="https://cbrennan.ie/img/linkedin_bw.jpeg" />
    <meta property="og:url" content="https://cbrennan.ie/projects-menu">

    <!-- Favicon -->
    <link rel="icon" href="./img/favicon.ico" sizes="any">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 7 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- AOS -->
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- Site CSS -->
    <link rel="stylesheet" href="./css/main.css">
  </head>

  <body>
    <!-- Navbar -->
    <header w3-include-html="navbar.html"></header>
    <div class="body-padding-bottom d-flex flex-column min-vh-100">
      <section class="pt-4 pt-md-11 flex-fill">
        <div class="container">
          <div class="justify-content-center col-12 mt-5 mb-5">
            <h2 class="text-center pt-5">
                MY <span class="text-primary">PROJECTS</span><br>
            </h2>
            <div id="projects-grid" class="row pt-3 pb-3"></div>
          </div> <!-- / .row -->
        </div> <!-- / .container -->
      </section>
    </div>
    <footer w3-include-html="footer.html"></footer>

    <!-- AOS + site JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script defer src="js/external.js"></script>

    <!-- Bootstrap 5 bundle -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Init -->
    <script>
      async function renderProjects() {
        try {
          const res = await fetch('/files/projects.json', { cache: 'no-store' });
          if (!res.ok) throw new Error('projects.json not found');
          const items = await res.json();

          const grid = document.getElementById('projects-grid');
          grid.innerHTML = items.map((p, i) => {
            const delay = (i % 3) * 300; // 0, 300, 600
            const title = p.titleHtml || p.title;
            return `
              <div class="col-md-4 mb-4" data-aos="fade-up" ${delay ? `data-aos-delay="${delay}"` : ''}>
                <div class="card h-100">
                  <img src="${p.img}" class="card-img-top bg-light project-thumb" alt="${p.alt || ''}" loading="lazy">
                  <div class="card-body">
                    <h5 class="card-title">${title}</h5>
                    <p class="card-text">${p.excerpt}</p>
                    <a href="${p.url}" class="stretched-link" aria-label="${p.title}"></a>
                  </div>
                  <div class="card-footer">
                    <small class="text-muted">${p.meta}</small>
                  </div>
                </div>
              </div>`;
          }).join('');
        } catch (e) {
          console.error('Projects JSON fetch failed:', e);
          const grid = document.getElementById('projects-grid');
          if (grid) grid.innerHTML = '<div class="col-12 text-center text-muted">Projects currently unavailable.</div>';
        }
      }

      window.addEventListener('load', async () => {
        if (typeof includeHTML === 'function') includeHTML();
        if (typeof scrollAnimation === 'function') scrollAnimation();

        await renderProjects();            // 1) render first
        if (window.AOS) {
          AOS.init({ once: true });        // 2) then init
          AOS.refreshHard();               // 3) and rescan injected nodes
        }
      });
    </script>
  </body>
</html>
