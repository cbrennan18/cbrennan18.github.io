<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Ciarán Brennan | Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Ciarán Brennan">
    <meta name="description" content="Ciarán Brennan — Category Manager in Ireland with a love for analytics, web development, design and sport.">
    <link rel="canonical" href="https://cbrennan.ie">

    <!-- Favicon -->
    <link rel="icon" href="./img/favicon.ico" sizes="any">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 7 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- AOS (use jsDelivr) -->
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- Site CSS -->
    <link rel="stylesheet" href="./css/main.css">

    <!-- Custom Javascript -->
    <script src="js/external.js"></script>

    <!-- About photo sizing (no intrinsic width/height) -->
    <style>
      #about-photo {
        width: 60%;
        max-width: 420px;
        height: auto;
        border-radius: 50%;
        filter: grayscale(100%);
      }
    </style>

    <!-- If JS is disabled, ensure AOS elements are visible -->
    <noscript>
      <style>
        [data-aos] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <!-- Navbar -->
    <header w3-include-html="navbar.html"></header>

    <main>
      <!-- Hero -->
      <div class="min-vh-100 pt-5" id="home">
        <section id="hero-image">
          <div class="container">
            <div class="row align-items-center pt-4">
              <div class="col-12 col-md-5 col-lg-6 order-md-2">
                <div class="img-overlay-wrap">
                  <img src="img/derrynane_small_bw.png"
                       class="img-fluid mw-md-150 mw-lg-130 mb-5 mb-md-0"
                       style="filter: grayscale(100%)"
                       alt="Landscape at Derrynane, Ireland"
                       loading="lazy"
                       data-aos="fade-up" data-aos-duration="3000">
                  <svg viewBox="0 0 200 200" aria-hidden="true">
                    <circle cx="75" cy="75" r="50" fill="#0275d8" fill-opacity="0.6"
                            data-aos="fade-up" data-aos-delay="1000" data-aos-duration="2000"></circle>
                    <circle cx="35" cy="35" r="25" fill="#000000" fill-opacity="0.4"
                            data-aos="fade-up" data-aos-duration="3000"></circle>
                  </svg>
                </div>
              </div>
              <div class="col-12 col-md-7 col-lg-6 order-md-1" data-aos="fade-up" data-aos-delay="1000" data-aos-duration="2000">
                <h1 class="text-center text-md-start mb-4">
                  Welcome to <span class="text-primary">my website</span>
                </h1>
                <div class="d-flex gap-3 justify-content-center justify-content-md-start">
                  <a href="./index.html#about" class="btn btn-outline-secondary btn-lg">About Me</a>
                  <a href="./projects-menu.html" class="btn btn-primary btn-lg">My Projects</a>
                </div>
              </div>
            </div> <!-- /row -->
          </div> <!-- /container -->
        </section>
      </div>

      <!-- About (JSON-driven) -->
      <div class="body-padding bg-light" id="about">
        <section class="my-4 my-md-11">
          <div class="container">
            <div class="row align-items-center">
              <div class="col-12 order-md-1">
                <h2 class="text-center">
                  ABOUT <span class="text-primary">ME</span><br>
                </h2>
              </div>
            </div>
            <div class="row align-items-center pt-5">
              <div class="col-12 col-md-5 col-lg-6 order-md-1">
                <div class="text-center">
                  <img id="about-photo"
                       src="img/linkedin_bw.jpeg"
                       alt="Portrait of Ciarán Brennan"
                       loading="lazy">
                </div>
              </div>
              <div class="col-12 col-md-7 col-lg-6 order-md-2">
                <h3 class="text-center text-md-start">
                  <span id="about-headline"></span>
                  <span class="text-primary"><br><span id="about-name"></span></span><br>
                </h3>
                <p id="about-blurb"></p>
              </div>
            </div>
          </div> <!-- /container -->
        </section>
      </div>  

      <!-- Experience (JSON-driven) -->
      <div class="body-padding-top" id="experience">
        <section class="pt-4 pt-md-11 pb-4 pb-md-11">
          <div class="container">
            <div class="row align-items-center mb-1">
              <div class="col-12 order-md-1">
                <h2 class="text-center">
                  WORK <span class="text-primary">EXPERIENCE</span><br>
                </h2>
              </div>
            </div>
            <div class="row align-items-center pt-5">
              <div class="col-md-12">
                <ul id="experience-list" class="timeline m-lg-5"></ul>
              </div>
            </div>
          </div> <!-- /container -->
        </section>
      </div>
    </main>

    <footer w3-include-html="footer.html"></footer>

    <!-- AOS (jsDelivr) + site JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

    <!-- Bootstrap 5 bundle -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Renderers -->
    <script>
      async function renderExperience() {
        try {
          const res = await fetch('/files/experience.json', { cache: 'no-store' });
          if (!res.ok) throw new Error('experience.json not found');
          const items = await res.json();
          const list = document.getElementById('experience-list');

          list.innerHTML = items.map(item => {
            const rolesHtml = item.roles.map(r => `
              <h6 class="text-secondary d-flex justify-content-between flex-wrap">
                <span>${r.title}</span>
                <span class="float-lg-end">${r.dates}</span>
              </h6>
              <p>${r.desc}</p>
            `).join('<br>');

            return `
              <li class="px-lg-5 py-lg-3">
                <a href="${item.url}"><h5 class="text-primary">${item.company}</h5></a>
                ${rolesHtml}
              </li>
            `;
          }).join('');
        } catch (e) {
          console.error(e);
          const list = document.getElementById('experience-list');
          if (list) list.innerHTML =
            '<li class="px-lg-5 py-lg-3"><p>Experience currently unavailable.</p></li>';
        }
      }

      async function renderAbout() {
        try {
          const res = await fetch('/files/about.json', { cache: 'no-store' });
          if (!res.ok) throw new Error('about.json not found');
          const data = await res.json();

          const headline = document.getElementById('about-headline');
          const nameEl  = document.getElementById('about-name');
          const blurb   = document.getElementById('about-blurb');
          const photo   = document.getElementById('about-photo');

          if (headline && data.headline) headline.textContent = data.headline;
          if (nameEl && data.name) nameEl.textContent = data.name;
          if (blurb && data.blurb) blurb.textContent = data.blurb;
          if (photo) {
            if (data.photoSrc) photo.src = data.photoSrc;
            if (data.photoAlt) photo.alt = data.photoAlt;
          }
        } catch (err) {
          console.warn('About JSON failed to load', err);
        }
      }

      function aosFallbackIfMissing() {
        if (!window.AOS) {
          document.querySelectorAll('[data-aos]').forEach(el => {
            el.style.opacity = 1;
            el.style.transform = 'none';
          });
        }
      }

      // Wait for all CSS/JS (and includes) to be ready
      window.addEventListener('load', () => {
        if (typeof includeHTML === 'function') includeHTML();
        if (typeof scrollAnimation === 'function') scrollAnimation();

        if (window.AOS) {
          AOS.init({ once: true });
        }
        // Ensure visibility even if AOS failed to load
        aosFallbackIfMissing();

        // JSON renders
        renderExperience();
        renderAbout();
      });
    </script>
  </body>
</html>
