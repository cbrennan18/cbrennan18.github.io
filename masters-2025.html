<!DOCTYPE html>
<html lang="en" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="UTF-8">
    <title>Ciarán Brennan | US Masters 2025</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Ciarán Brennan">
    <meta name="description" content="Tracking how the group's players are performing at the 2025 US Masters in Augusta.">
    <link rel="canonical" href="https://cbrennan.ie/masters-2025.html">

    <!-- OpenGraph -->
    <meta property="og:site_name" content="cbrennan.ie">
    <meta property="og:title" content="Ciarán Brennan - 2025 US Masters Augusta Buster">
    <meta property="og:description" content="Tracking how the group's players are performing at the 2025 US Masters in Augusta.">
    <meta property="og:image" content="https://cbrennan.ie/img/masters2025.jpeg" />
    <meta property="og:url" content="https://cbrennan.ie/masters-2025.html">
    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" href="./img/favicon.ico" sizes="any">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 7 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- AOS -->
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- Site CSS -->
    <link rel="stylesheet" href="./css/main.css">

    <!-- Custom Javascript -->
    <script src="js/external.js"></script>

  </head>

  <body>
    <!-- Navbar -->
    <header w3-include-html="navbar.html"></header>

    <main class="body-padding-bottom">
      <section class="pt-4 pt-md-11">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 order-md-2 pt-5 pb-5">
              <h2 class="text-center text-md-start pt-5">
                MASTERS <span class="text-danger">BUSTER</span>
              </h2>
              <h6 class="text-center text-md-start">
                <i>11 April 2025, 14:00</i>
              </h6>

              <div data-aos="fade-up" data-aos-duration="2000">
                <img src="img/masters2025.jpeg" class="img-fluid" alt="The 18th at Augusta — Photo by Cian O'Regan Photography" loading="lazy"/>
                <div class="text-end">
                  <a style="background-color:#d9d9d9;color:black;text-decoration:none;padding:4px 6px;font-family:-apple-system,BlinkMacSystemFont,San Francisco,Helvetica Neue,Helvetica,Ubuntu,Roboto,Noto,Segoe UI,Arial,sans-serif;font-size:12px;font-weight:bold;line-height:1.2;display:inline-block;border-radius:3px"
                     href="https://www.cianoregan.com/" target="_blank" rel="noopener noreferrer" title="Cian O'Regan Photography">
                    <span style="display:inline-block;padding:2px 3px">18th at Augusta<br>Photo by Cian O'Regan Photography</span>
                  </a>
                </div>

                <br><br>

                <div class="table-responsive table-sm">
                  <table id="participantsTable" class="table table-striped table-bordered align-middle">
                    <thead>
                      <tr>
                        <th>Name</th>
                        <th>Total</th>
                        <th>Player 1</th>
                        <th>Player 2</th>
                        <th>Player 3</th>
                      </tr>
                    </thead>
                    <tbody><!-- filled by JS --></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div> <!-- /row -->
        </div> <!-- /container -->
      </section>
    </main>

    <footer w3-include-html="footer.html"></footer>

    <!-- AOS + site JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

    <!-- Bootstrap 5 bundle -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Init + Page Logic -->
    <script>
      window.addEventListener('load', () => {
        if (typeof includeHTML === 'function') includeHTML();
        // Only call if your scrollAnimation implementation doesn't depend on jQuery
        if (window.jQuery && typeof scrollAnimation === 'function') scrollAnimation();
        if (window.AOS) AOS.init({ once: true });

        // After DOM is ready, fetch data
        initMastersPage();
      });

      async function initMastersPage() {
        const urlMasters = 'https://www.masters.com/en_US/scores/feeds/2025/scores.json';
        const urlParticipants = './files/masters2025.json';

        try {
          const [masters, participants] = await Promise.all([getJSON(urlMasters), getJSON(urlParticipants)]);
          const mastersPlayers = masters?.data?.player || [];
          const result = participants.map(p => {
            const p1 = makeEntry(p['Player 1'], mastersPlayers);
            const p2 = makeEntry(p['Player 2'], mastersPlayers);
            const p3 = makeEntry(p['Player 3'], mastersPlayers);
            return {
              participant: p.Name,
              totalScore: p1.score + p2.score + p3.score,
              p1, p2, p3
            };
          }).sort((a, b) => a.totalScore - b.totalScore);

          populateTable(result);
        } catch (err) {
          console.error('Error fetching data:', err);
          const tbody = document.querySelector('#participantsTable tbody');
          if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="text-center">Data unavailable.</td></tr>';
        }
      }

      function makeEntry(fullName, players) {
        const player = players.find(pl => pl.full_name === fullName);
        const score = Number.parseInt(player?.topar, 10);
        return {
          id: player?.id ?? null,
          name: fullName,
          score: Number.isFinite(score) ? score : 0
        };
      }

      async function getJSON(url) {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Fetch failed: ${url}`);
        return res.json();
      }

      function populateTable(rows) {
        const tbody = document.querySelector('#participantsTable tbody');
        tbody.innerHTML = rows.map(r => {
          const s1 = surname(r.p1.name), s2 = surname(r.p2.name), s3 = surname(r.p3.name);
          return `
            <tr>
              <td>${r.participant}</td>
              <td>${r.totalScore}</td>
              <td>${s1}: ${r.p1.score}</td>
              <td>${s2}: ${r.p2.score}</td>
              <td>${s3}: ${r.p3.score}</td>
            </tr>`;
        }).join('');
      }

      function surname(full) {
        const parts = String(full).trim().split(/\s+/);
        return parts[parts.length - 1] || full;
      }
    </script>
  </body>
</html>
