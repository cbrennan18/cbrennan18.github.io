    <!-- Init + Page Logic -->
    <script>
      window.addEventListener('load', () => {
        if (typeof includeHTML === 'function') includeHTML();
        // Only call if your scrollAnimation implementation doesn't depend on jQuery
        if (window.jQuery && typeof scrollAnimation === 'function') scrollAnimation();
        if (window.AOS) AOS.init({ once: true });

        // After DOM is ready, fetch data
        initMastersPage();
      });

      async function initMastersPage() {
        const urlMasters = 'https://www.masters.com/en_US/scores/feeds/2025/scores.json';
        const urlParticipants = './files/masters2025.json';

        try {
          const [masters, participants] = await Promise.all([getJSON(urlMasters), getJSON(urlParticipants)]);
          const mastersPlayers = masters?.data?.player || [];
          const result = participants.map(p => {
            const p1 = makeEntry(p['Player 1'], mastersPlayers);
            const p2 = makeEntry(p['Player 2'], mastersPlayers);
            const p3 = makeEntry(p['Player 3'], mastersPlayers);
            return {
              participant: p.Name,
              totalScore: p1.score + p2.score + p3.score,
              p1, p2, p3
            };
          }).sort((a, b) => a.totalScore - b.totalScore);

          populateTable(result);
        } catch (err) {
          console.error('Error fetching data:', err);
          const tbody = document.querySelector('#participantsTable tbody');
          if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="text-center">Data unavailable.</td></tr>';
        }
      }

      function makeEntry(fullName, players) {
        const player = players.find(pl => pl.full_name === fullName);
        const score = Number.parseInt(player?.topar, 10);
        return {
          id: player?.id ?? null,
          name: fullName,
          score: Number.isFinite(score) ? score : 0
        };
      }

      async function getJSON(url) {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Fetch failed: ${url}`);
        return res.json();
      }

      function populateTable(rows) {
        const tbody = document.querySelector('#participantsTable tbody');
        tbody.innerHTML = rows.map(r => {
          const s1 = surname(r.p1.name), s2 = surname(r.p2.name), s3 = surname(r.p3.name);
          return `
            <tr>
              <td>${r.participant}</td>
              <td>${r.totalScore}</td>
              <td>${s1}: ${r.p1.score}</td>
              <td>${s2}: ${r.p2.score}</td>
              <td>${s3}: ${r.p3.score}</td>
            </tr>`;
        }).join('');
      }

      function surname(full) {
        const parts = String(full).trim().split(/\s+/);
        return parts[parts.length - 1] || full;
      }
    </script>
