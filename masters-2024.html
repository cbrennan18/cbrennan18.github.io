  <body>
    <!-- Navbar -->
    <header w3-include-html="navbar.html"></header>

    <main class="body-padding-bottom">
      <section class="pt-4 pt-md-11">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 order-md-2 pt-5 pb-5">
              <h2 class="text-center text-md-start pt-5">
                MASTERS <span class="text-danger">BUSTER</span>
              </h2>
              <h6 class="text-center text-md-start">
                <i>11 April 2024, 21:00</i>
              </h6>

              <div data-aos="fade-up" data-aos-duration="2000">
                <img src="img/corkgc.webp" class="img-fluid" alt="Cork Golf Club — Photo by Cian O'Regan Photography" loading="lazy"/>
                <div class="text-end">
                  <a style="background-color:#d9d9d9;color:black;text-decoration:none;padding:4px 6px;font-family:-apple-system,BlinkMacSystemFont,San Francisco,Helvetica Neue,Helvetica,Ubuntu,Roboto,Noto,Segoe UI,Arial,sans-serif;font-size:12px;font-weight:bold;line-height:1.2;display:inline-block;border-radius:3px"
                     href="https://www.cianoregan.com/products/12th-hole-cork-golf-club"
                     target="_blank" rel="noopener noreferrer" title="Cian O'Regan Photography">
                    <span style="display:inline-block;padding:2px 3px">Cork Golf Club<br>Photo by Cian O'Regan Photography</span>
                  </a>
                </div>

                <br><br>

                <div class="table-responsive table-sm">
                  <table id="participantsTable" class="table table-striped table-bordered align-middle">
                    <thead>
                      <tr>
                        <th>Name</th>
                        <th>Total</th>
                        <th>Past Champ</th>
                        <th>American</th>
                        <th>International</th>
                        <th>LIV</th>
                      </tr>
                    </thead>
                    <tbody><!-- filled by JS --></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div> <!-- /row -->
        </div> <!-- /container -->
      </section>
    </main>

    <footer w3-include-html="footer.html"></footer>

    <!-- AOS + site JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script defer src="js/external.js"></script>

    <!-- Bootstrap 5 bundle -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Init + Page Logic -->
    <script>
      window.addEventListener('load', () => {
        if (typeof includeHTML === 'function') includeHTML();

        // Only call if your scrollAnimation implementation requires jQuery & is present
        if (window.jQuery && typeof scrollAnimation === 'function') scrollAnimation();

        // Back-to-top fallback if Scroll() (jQuery) isn't available
        if (typeof window.Scroll !== 'function') {
          window.Scroll = function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return false;
          }
        }

        if (window.AOS) AOS.init({ once: true });

        initMasters2024();
      });

      async function initMasters2024() {
        const urlMasters = 'https://www.masters.com/en_US/scores/feeds/2024/scores.json';
        const urlParticipants = './files/masters2024.json';

        try {
          const [masters, participants] = await Promise.all([getJSON(urlMasters), getJSON(urlParticipants)]);
          const players = masters?.data?.player || [];

          const rows = participants.map(p => {
            const past = makeEntry(p['Past Champion'], players);
            const usa  = makeEntry(p['American'], players);
            const intl = makeEntry(p['International'], players);
            const liv  = makeEntry(p['LIV'], players);
            return {
              participant: p.Name,
              totalScore: past.score + usa.score + intl.score + liv.score,
              past, usa, intl, liv
            };
          }).sort((a, b) => a.totalScore - b.totalScore);

          populateTable(rows);
        } catch (err) {
          console.error('Error fetching data:', err);
          const tbody = document.querySelector('#participantsTable tbody');
          if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center">Data unavailable.</td></tr>';
        }
      }

      function makeEntry(fullName, players) {
        const player = players.find(pl => pl.full_name === fullName);
        const score = Number.parseInt(player?.topar, 10);
        return {
          id: player?.id ?? null,
          name: fullName,
          score: Number.isFinite(score) ? score : 0
        };
      }

      async function getJSON(url) {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Fetch failed: ${url}`);
        return res.json();
      }

      function populateTable(rows) {
        const tbody = document.querySelector('#participantsTable tbody');
        tbody.innerHTML = rows.map(r => {
          return `
            <tr>
              <td>${r.participant}</td>
              <td>${r.totalScore}</td>
              <td>${surname(r.past.name)}: ${r.past.score}</td>
              <td>${surname(r.usa.name)}: ${r.usa.score}</td>
              <td>${surname(r.intl.name)}: ${r.intl.score}</td>
              <td>${surname(r.liv.name)}: ${r.liv.score}</td>
            </tr>`;
        }).join('');
      }

      function surname(full) {
        const parts = String(full).trim().split(/\s+/);
        return parts[parts.length - 1] || full;
      }
    </script>
  </body>
</html>
