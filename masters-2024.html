    <!-- Init + Page Logic -->
    <script>
      window.addEventListener('load', () => {
        if (typeof includeHTML === 'function') includeHTML();

        // Only call if your scrollAnimation implementation requires jQuery & is present
        if (window.jQuery && typeof scrollAnimation === 'function') scrollAnimation();

        // Back-to-top fallback if Scroll() (jQuery) isn't available
        if (typeof window.Scroll !== 'function') {
          window.Scroll = function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return false;
          }
        }

        if (window.AOS) AOS.init({ once: true });

        initMasters2024();
      });

      async function initMasters2024() {
        const urlMasters = 'https://www.masters.com/en_US/scores/feeds/2024/scores.json';
        const urlParticipants = './files/masters2024.json';

        try {
          const [masters, participants] = await Promise.all([getJSON(urlMasters), getJSON(urlParticipants)]);
          const players = masters?.data?.player || [];

          const rows = participants.map(p => {
            const past = makeEntry(p['Past Champion'], players);
            const usa  = makeEntry(p['American'], players);
            const intl = makeEntry(p['International'], players);
            const liv  = makeEntry(p['LIV'], players);
            return {
              participant: p.Name,
              totalScore: past.score + usa.score + intl.score + liv.score,
              past, usa, intl, liv
            };
          }).sort((a, b) => a.totalScore - b.totalScore);

          populateTable(rows);
        } catch (err) {
          console.error('Error fetching data:', err);
          const tbody = document.querySelector('#participantsTable tbody');
          if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center">Data unavailable.</td></tr>';
        }
      }

      function makeEntry(fullName, players) {
        const player = players.find(pl => pl.full_name === fullName);
        const score = Number.parseInt(player?.topar, 10);
        return {
          id: player?.id ?? null,
          name: fullName,
          score: Number.isFinite(score) ? score : 0
        };
      }

      async function getJSON(url) {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Fetch failed: ${url}`);
        return res.json();
      }

      function populateTable(rows) {
        const tbody = document.querySelector('#participantsTable tbody');
        tbody.innerHTML = rows.map(r => {
          return `
            <tr>
              <td>${r.participant}</td>
              <td>${r.totalScore}</td>
              <td>${surname(r.past.name)}: ${r.past.score}</td>
              <td>${surname(r.usa.name)}: ${r.usa.score}</td>
              <td>${surname(r.intl.name)}: ${r.intl.score}</td>
              <td>${surname(r.liv.name)}: ${r.liv.score}</td>
            </tr>`;
        }).join('');
      }

      function surname(full) {
        const parts = String(full).trim().split(/\s+/);
        return parts[parts.length - 1] || full;
      }
    </script>
