  <!-- Page logic -->
  <script>
    window.addEventListener('load', () => {
      if (typeof includeHTML === 'function') includeHTML();
      if (typeof scrollAnimation === 'function') scrollAnimation();
      if (window.AOS) AOS.init({ once: true });
      initMasters2021();
    });

    async function initMasters2021() {
      const feedUrl   = 'https://www.masters.com/en_US/scores/feeds/2021/scores.json';
      const ownersUrl = './files/masters.json';

      try {
        const [feed, ownersRaw] = await Promise.all([getJSON(feedUrl), getJSON(ownersUrl)]);
        const players = feed?.data?.player || [];

        // remove blank owners/players
        const owners = (ownersRaw || []).filter(o => (o.owner || '').trim() && (o.player || '').trim());

        // known display-name differences between your JSON and the Masters feed
        const aliasMap = {
          'Cheng Tsung Pan': 'C T Pan',
          'Sebastián Muñoz': 'Sebastian Munoz',
          'José María Olazábal': 'Jose Maria Olazabal'
          // add more if you spot mismatches in console
        };

        const normalize = s =>
          (s || '')
            .normalize('NFD')
            .replace(/\p{Diacritic}/gu,'')
            .replace(/[.\-()']/g,' ')
            .replace(/\s+/g,' ')
            .trim()
            .toLowerCase();

        // Map normalized player name -> owner
        const ownersMap = new Map(
          owners.map(({ owner, player }) => {
            const aliased = aliasMap[player] || player;
            return [normalize(aliased), owner];
          })
        );

        // Build rows
        const rows = players
          .map(p => {
            const key = normalize(p.full_name);
            const owner = ownersMap.get(key);
            if (!owner) return null;

            const rounds = extractRounds(p);
            return {
              owner,
              player: p.full_name,
              pos: p.pos ?? p.current_position ?? '',
              total: fmtTotal(p.topar),
              thru: fmtThru(p.thru),
              today: fmtToday(p.today),
              ...rounds
            };
          })
          .filter(Boolean)
          .sort((a, b) => scoreSort(a.total) - scoreSort(b.total));

        renderTable('masters2021', rows);

        // Warn about any JSON entries that didn't match feed
        const feedNames = new Set(players.map(p => normalize(p.full_name)));
        owners.forEach(({ player }) => {
          const aliased = aliasMap[player] || player;
          if (!feedNames.has(normalize(aliased))) {
            console.warn('No feed match for:', player, '(check spelling or add to aliasMap)');
          }
        });

      } catch (err) {
        console.error('Masters 2021 fetch/render error:', err);
        const tbody = document.querySelector('#masters2021 tbody');
        if (tbody) tbody.innerHTML =
          '<tr><td colspan="10" class="text-center">Data unavailable.</td></tr>';
      }
    }

    async function getJSON(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`Fetch failed: ${url}`);
      return res.json();
    }

    function renderTable(tableId, rows) {
      const tbody = document.querySelector('#' + tableId + ' tbody');
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td>${r.owner}</td>
          <td>${r.player}</td>
          <td>${r.pos || '&ndash;'}</td>
          <td>${r.total}</td>
          <td>${r.thru}</td>
          <td>${r.today}</td>
          <td>${r.r1}</td>
          <td>${r.r2}</td>
          <td>${r.r3}</td>
          <td>${r.r4}</td>
        </tr>
      `).join('');
    }

    function fmtTotal(topar) {
      const n = parseInt(topar, 10);
      if (!Number.isFinite(n)) return '&ndash;';
      if (n === 0) return 'E';
      return n > 0 ? `+${n}` : `${n}`;
    }
    function fmtThru(thru) {
      if (thru === 18 || thru === '18') return 'F';
      if (thru == null || thru === '') return '&ndash;';
      return thru;
    }
    function fmtToday(today) {
      const n = parseInt(today, 10);
      if (!Number.isFinite(n)) return '&ndash;';
      if (n === 0) return 'E';
      return n > 0 ? `+${n}` : `${n}`;
    }

    function extractRounds(p) {
      const r = { r1: '&ndash;', r2: '&ndash;', r3: '&ndash;', r4: '&ndash;' };

      // Common feed keys
      if (p.r1 || p.r2 || p.r3 || p.r4) {
        r.r1 = safeRound(p.r1); r.r2 = safeRound(p.r2);
        r.r3 = safeRound(p.r3); r.r4 = safeRound(p.r4);
        return r;
      }
      // Sometimes provided as an array
      if (Array.isArray(p.rounds)) {
        for (let i = 0; i < Math.min(4, p.rounds.length); i++) {
          const score = p.rounds[i]?.score ?? p.rounds[i]?.strokes;
          r['r' + (i + 1)] = safeRound(score);
        }
      }
      return r;
    }

    function safeRound(v) {
      const n = parseInt(v, 10);
      return Number.isFinite(n) ? String(n) : '&ndash;';
    }

    function scoreSort(totalStr) {
      if (totalStr === 'E') return 0;
      if (totalStr === '&ndash;') return 9999;
      return Number(totalStr.replace('+', '')) || 9999;
    }
  </script>
